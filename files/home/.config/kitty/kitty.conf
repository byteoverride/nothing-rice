# ── Nothing-flavoured kitty ────────────────────────────────────────────
# monochrome base, single red accent, blurred + undecorated

# ── font ──
font_family              JetBrainsMono Nerd Font
bold_font                JetBrainsMono Nerd Font Bold
italic_font              JetBrainsMono Nerd Font Italic
bold_italic_font         JetBrainsMono Nerd Font Bold Italic
font_size                11.0
disable_ligatures        never
modify_font              cell_height 115%

# ── window ──
hide_window_decorations  yes
window_padding_width     14
window_margin_width      0
placement_strategy       center
remember_window_size     no
initial_window_width     1100
initial_window_height    680
confirm_os_window_close  0

# ── transparency + blur (KWin picks this up on Wayland) ──
background_opacity       0.72
background_blur          64
dynamic_background_opacity yes

# ── cursor ──
cursor_shape             block
cursor_blink_interval    0
cursor                   #d71921

# ── bell / scrollback ──
enable_audio_bell        no
scrollback_lines         20000
copy_on_select           yes

# ── tabs ──
tab_bar_edge             top
tab_bar_style            powerline
tab_powerline_style      slanted
active_tab_foreground    #0a0a0a
active_tab_background    #e8e8e8
inactive_tab_foreground  #6a6a6a
inactive_tab_background  #141414
tab_bar_background       none

# ── colours: near-black canvas, grey ramp, Nothing red accent ──
foreground               #e6e6e6
background               #0a0a0a
selection_foreground     #0a0a0a
selection_background     #d71921

url_color                #d71921
url_style                straight

# black
color0  #141414
color8  #3a3a3a
# red (Nothing red)
color1  #d71921
color9  #ff4b52
# green -> desaturated
color2  #9a9a9a
color10 #c4c4c4
# yellow -> light grey
color3  #b4b4b4
color11 #dcdcdc
# blue -> mid grey
color4  #7c7c7c
color12 #a8a8a8
# magenta -> red-tinted
color5  #a8313a
color13 #d96b70
# cyan -> grey
color6  #8e8e8e
color14 #bfbfbf
# white
color7  #e6e6e6
color15 #ffffff

# ── keys ──
map ctrl+shift+enter     new_window
map ctrl+shift+t         new_tab
map ctrl+plus            change_font_size all +1.0
map ctrl+minus           change_font_size all -1.0
map ctrl+0               change_font_size all 0
